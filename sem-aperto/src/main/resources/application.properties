spring.application.name=sem-aperto
server.port=8080

# ---------- Banco de dados (MySQL) ----------
# O banco "sem_aperto" é criado sozinho na primeira vez (createDatabaseIfNotExist).
# Troque usuário e senha pelos do seu MySQL.
spring.datasource.url=jdbc:mysql://localhost:3306/sem_aperto?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=P@$$w0rd

# As tabelas são criadas pelo script src/main/resources/schema.sql
# (o Hibernate não mexe na estrutura do banco).
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- Sessão ----------
# O usuário fica "logado" por 8 horas sem usar o sistema.
server.servlet.session.timeout=8h
